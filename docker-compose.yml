version: '3.8'

services:
  axiom-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: axiom-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - NEBIUS_API_KEY=${NEBIUS_API_KEY:-v1.CmQKHHN0YXRpY2tleS1lMDBrcTg0cXM0dnI3MGE1dzgSIXNlcnZpY2VhY2NvdW50LWUwMHpmNXAxNGhjZ2tqdnR5NDIMCJm_z9UGEMifs5kBOgwImsLnoAcQwJKmiwNAAloDZTAw.AAAAAAAAAAHiz-jsg4lPLG6e3H0bMYDjeqytHaL6lhQweoWwaV-T99pJ7ozUhqkJqhZrQtoVOTnzjsJMip6xQ5pIUC6ctwMB}
      - NEBIUS_BASE_URL=${NEBIUS_BASE_URL:-https://api.tokenfactory.nebius.com/v1/}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-tvly-mock-key}
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
    networks:
      - axiom-network

  axiom-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: axiom-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://axiom-backend:8000/api/
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      axiom-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - axiom-network

networks:
  axiom-network:
    driver: bridge
