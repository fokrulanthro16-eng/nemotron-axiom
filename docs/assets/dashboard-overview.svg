  <!-- Dual-Pane Code Editor -->
  <g transform="translate(20, 214)">
    <!-- Left Pane: Flawed Code -->
    <rect width="570" height="380" rx="8" fill="#13141c" stroke="#ef4444" stroke-opacity="0.6"/>
    <rect width="570" height="36" rx="8" fill="#18181b"/>
    <circle cx="20" cy="18" r="4" fill="#ef4444"/>
    <text x="32" y="22" fill="#ef4444" font-family="ui-monospace, monospace" font-size="11" font-weight="700">FLAWED TARGET: demo_samples/deadlock_banking.py</text>
    <rect x="420" y="7" width="135" height="22" rx="4" fill="#ef4444" fill-opacity="0.2"/>
    <text x="430" y="22" fill="#ef4444" font-family="ui-monospace, monospace" font-size="10" font-weight="700">[!] DEADLOCK HAZARD</text>

    <!-- Code Content Left -->
    <g transform="translate(16, 52)" font-family="ui-monospace, monospace" font-size="11" fill="#a1a1aa">
      <text y="16"><tspan fill="#52525b">01</tspan>  <tspan fill="#f43f5e">def</tspan> <tspan fill="#38bdf8">transfer</tspan>(from_acc, to_acc, amount):</text>
      <text y="36"><tspan fill="#52525b">02</tspan>      <tspan fill="#71717a"># CRITICAL DEFECT: Arbitrary nested lock acquisition</tspan></text>
      <text y="56" fill="#ef4444"><tspan fill="#52525b">03</tspan>      <tspan fill="#f43f5e">with</tspan> from_acc.lock: <tspan fill="#ef4444" font-weight="700">&lt;-- Thread 1 acquires lock A</tspan></text>
      <text y="76"><tspan fill="#52525b">04</tspan>          time.sleep(0.001)  <tspan fill="#71717a"># Context switch</tspan></text>
      <text y="96" fill="#ef4444"><tspan fill="#52525b">05</tspan>          <tspan fill="#f43f5e">with</tspan> to_acc.lock:   <tspan fill="#ef4444" font-weight="700">&lt;-- Thread 2 holds B, waits for A</tspan></text>
      <text y="116"><tspan fill="#52525b">06</tspan>              from_acc.bal -= amount</text>
      <text y="136"><tspan fill="#52525b">07</tspan>              to_acc.bal += amount</text>
      <text y="156"><tspan fill="#52525b">08</tspan>              <tspan fill="#f43f5e">return</tspan> <tspan fill="#38bdf8">True</tspan></text>
    </g>

    <!-- Z3 Callout Box Left -->
    <rect x="16" y="235" width="538" height="125" rx="6" fill="#201015" stroke="#ef4444" stroke-opacity="0.4"/>
    <text x="30" y="258" fill="#ef4444" font-family="ui-sans-serif, sans-serif" font-size="11" font-weight="800">Z3 SMT COUNTEREXAMPLE PROOF TRACE (UNSAT):</text>
    <text x="30" y="278" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="10">&exist; t1, t2 : WaitsFor(t1, L_B) &and; Holds(t1, L_A) &and; WaitsFor(t2, L_A) &and; Holds(t2, L_B)</text>
    <text x="30" y="298" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="10">&bull; Step 1: Thread-1 acquires Account_1.lock</text>
    <text x="30" y="316" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="10">&bull; Step 2: Thread-2 acquires Account_2.lock</text>
    <text x="30" y="334" fill="#f87171" font-family="ui-monospace, monospace" font-size="10">&bull; Step 3: Circular wait deadlock formed (Coffman #4 satisfied)</text>

    <!-- Right Pane: Synthesized Patch -->
    <g transform="translate(590, 0)">
      <rect width="570" height="380" rx="8" fill="#13141c" stroke="#10b981" stroke-opacity="0.6"/>
      <rect width="570" height="36" rx="8" fill="#18181b"/>
      <circle cx="20" cy="18" r="4" fill="#10b981"/>
      <text x="32" y="22" fill="#10b981" font-family="ui-monospace, monospace" font-size="11" font-weight="700">NVIDIA NEMOTRON-70B SURGICALLY SYNTHESIZED PATCH</text>
      <rect x="420" y="7" width="135" height="22" rx="4" fill="#10b981" fill-opacity="0.2"/>
      <text x="430" y="22" fill="#10b981" font-family="ui-monospace, monospace" font-size="10" font-weight="700">&check; Z3 CERTIFIED SAFE</text>

      <!-- Code Content Right -->
      <g transform="translate(16, 52)" font-family="ui-monospace, monospace" font-size="11" fill="#a1a1aa">
        <text y="16"><tspan fill="#52525b">01</tspan>  <tspan fill="#f43f5e">def</tspan> <tspan fill="#38bdf8">transfer</tspan>(from_acc, to_acc, amount):</text>
        <text y="36" fill="#10b981"><tspan fill="#52525b">02</tspan>      <tspan fill="#71717a"># Formal SMT Invariant: Canonical ID Lock Ordering</tspan></text>
        <text y="56" fill="#10b981"><tspan fill="#52525b">03</tspan>      first_lock, second_lock = (</text>
        <text y="76" fill="#10b981"><tspan fill="#52525b">04</tspan>          (from_acc.lock, to_acc.lock) <tspan fill="#f43f5e">if</tspan> from_acc.id &lt; to_acc.id</text>
        <text y="96" fill="#10b981"><tspan fill="#52525b">05</tspan>          <tspan fill="#f43f5e">else</tspan> (to_acc.lock, from_acc.lock)</text>
        <text y="116" fill="#10b981"><tspan fill="#52525b">06</tspan>      )</text>
        <text y="136"><tspan fill="#52525b">07</tspan>      <tspan fill="#f43f5e">with</tspan> first_lock:</text>
        <text y="156"><tspan fill="#52525b">08</tspan>          <tspan fill="#f43f5e">with</tspan> second_lock:</text>
        <text y="176"><tspan fill="#52525b">09</tspan>              from_acc.bal -= amount</text>
        <text y="196"><tspan fill="#52525b">10</tspan>              to_acc.bal += amount</text>
        <text y="216"><tspan fill="#52525b">11</tspan>              <tspan fill="#f43f5e">return</tspan> <tspan fill="#38bdf8">True</tspan></text>
      </g>

      <!-- Z3 Verification Attestation Right -->
      <rect x="16" y="278" width="538" height="82" rx="6" fill="#0d1f17" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="30" y="300" fill="#10b981" font-family="ui-sans-serif, sans-serif" font-size="11" font-weight="800">FIRST-ORDER LOGIC SMT VERDICT: SAT (PROVABLY CORRECT)</text>
      <text x="30" y="320" fill="#a7f3d0" font-family="ui-monospace, monospace" font-size="10">&forall; t1, t2 : Rank(L_min) = 0 &prec; Rank(L_max) = 1 &rArr; Acyclic Dependency Graph</text>
      <text x="30" y="340" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="10">SLSA Level 3 Attestation: ax-sig-ed25519-1d1223eddb73d0da65eba8ebb2d84543</text>
