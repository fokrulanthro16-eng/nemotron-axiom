    <!-- Step 2 -->
    <rect x="252" y="34" width="205" height="34" rx="6" fill="#18181b" stroke="#76b900" stroke-width="1.5"/>
    <circle cx="268" cy="51" r="5" fill="#76b900"/>
    <text x="280" y="55" fill="#ffffff" font-family="ui-monospace, monospace" font-size="11" font-weight="600">2. Nemotron Invariants</text>

