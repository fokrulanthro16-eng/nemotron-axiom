<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#120e1a"/>
    </linearGradient>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ef4444" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#10b981" />
    </marker>
  </defs>

  <rect width="1000" height="600" fill="url(#bg3)"/>

  <!-- Header Bar -->
  <rect x="20" y="20" width="960" height="42" rx="8" fill="#18181b" stroke="#27272a"/>
  <circle cx="45" cy="41" r="6" fill="#ef4444"/>
  <circle cx="65" cy="41" r="6" fill="#f59e0b"/>
  <circle cx="85" cy="41" r="6" fill="#10b981"/>
  <text x="110" y="46" fill="#a855f7" font-family="ui-monospace, monospace" font-size="12" font-weight="700">MICROSOFT Z3 SMT THEOREM PROVER v4.13</text>
  <text x="430" y="46" fill="#71717a" font-family="ui-monospace, monospace" font-size="12">|</text>
  <text x="450" y="46" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="12">First-Order Logic &amp; Topological Rank Constraint Inspector</text>

  <!-- Formula Banner -->
  <rect x="20" y="74" width="960" height="48" rx="8" fill="#1a1426" stroke="#a855f7" stroke-opacity="0.4"/>
  <text x="40" y="96" fill="#d8b4fe" font-family="ui-monospace, monospace" font-size="11" font-weight="700">PRIMARY SAFETY INVARIANT (GLOBAL ACYCLIC LOCK ORDERING):</text>
  <text x="40" y="112" fill="#ffffff" font-family="ui-monospace, monospace" font-size="12" font-weight="600">&forall; t1, t2 &isin; Threads : (Holds(t1, L_A) &and; WaitsFor(t1, L_B) &and; Holds(t2, L_B)) &rArr; &not;WaitsFor(t2, L_A)</text>

  <!-- Graph Comparisons -->
  <g transform="translate(20, 134)">
    <!-- Left: Cyclic Deadlock Graph -->
    <rect width="470" height="240" rx="8" fill="#181014" stroke="#ef4444" stroke-opacity="0.5"/>
    <text x="20" y="26" fill="#ef4444" font-family="ui-sans-serif, sans-serif" font-size="12" font-weight="800">1. FLAWED STATE SPACE: CYCLIC DEADLOCK (UNSAT)</text>
    
    <!-- Nodes and cyclic arrows -->
    <!-- Node T1 -->
    <circle cx="120" cy="90" r="26" fill="#2d1217" stroke="#ef4444" stroke-width="2"/>
    <text x="112" y="94" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="11" font-weight="700">T1</text>
    
    <!-- Node L_B -->
    <circle cx="340" cy="90" r="26" fill="#2d1217" stroke="#ef4444" stroke-width="2"/>
    <text x="330" y="94" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="11" font-weight="700">L_B</text>

    <!-- Node T2 -->
    <circle cx="340" cy="180" r="26" fill="#2d1217" stroke="#ef4444" stroke-width="2"/>
    <text x="332" y="184" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="11" font-weight="700">T2</text>

    <!-- Node L_A -->
    <circle cx="120" cy="180" r="26" fill="#2d1217" stroke="#ef4444" stroke-width="2"/>
    <text x="110" y="184" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="11" font-weight="700">L_A</text>

    <!-- Cyclic Edges -->
    <line x1="146" y1="90" x2="310" y2="90" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
    <text x="210" y="82" fill="#ef4444" font-family="ui-monospace, monospace" font-size="9">WaitsFor</text>

    <line x1="340" y1="116" x2="340" y2="150" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
    <text x="346" y="136" fill="#ef4444" font-family="ui-monospace, monospace" font-size="9">HeldBy</text>

    <line x1="314" y1="180" x2="150" y2="180" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
    <text x="210" y="172" fill="#ef4444" font-family="ui-monospace, monospace" font-size="9">WaitsFor</text>

    <line x1="120" y1="154" x2="120" y2="120" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
    <text x="80" y="140" fill="#ef4444" font-family="ui-monospace, monospace" font-size="9">HeldBy</text>

    <!-- Cycle callout -->
    <rect x="180" y="105" x-anchor="center" width="100" height="24" rx="4" fill="#ef4444"/>
    <text x="190" y="121" fill="#ffffff" font-family="ui-monospace, monospace" font-size="10" font-weight="800">CYCLE FOUND</text>
  </g>

  <!-- Right: Synthesized Monotonic DAG -->
  <g transform="translate(510, 134)">
    <rect width="470" height="240" rx="8" fill="#0d1f17" stroke="#10b981" stroke-opacity="0.6"/>
    <text x="20" y="26" fill="#10b981" font-family="ui-sans-serif, sans-serif" font-size="12" font-weight="800">2. SYNTHESIZED STATE SPACE: MONOTONIC DAG (SAT)</text>

    <!-- Directed acyclic nodes -->
    <circle cx="80" cy="135" r="28" fill="#123d2b" stroke="#10b981" stroke-width="2"/>
    <text x="64" y="132" fill="#a7f3d0" font-family="ui-monospace, monospace" font-size="11" font-weight="700">L_min</text>
    <text x="66" y="146" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="9">Rank=0</text>

    <line x1="112" y1="135" x2="210" y2="135" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <text x="135" y="124" fill="#10b981" font-family="ui-monospace, monospace" font-size="10" font-weight="700">&prec; Order</text>

    <circle cx="242" cy="135" r="28" fill="#123d2b" stroke="#10b981" stroke-width="2"/>
    <text x="226" y="132" fill="#a7f3d0" font-family="ui-monospace, monospace" font-size="11" font-weight="700">L_max</text>
    <text x="228" y="146" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="9">Rank=1</text>

    <line x1="274" y1="135" x2="368" y2="135" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <text x="295" y="124" fill="#10b981" font-family="ui-monospace, monospace" font-size="10" font-weight="700">&prec; Order</text>

    <circle cx="400" cy="135" r="28" fill="#123d2b" stroke="#10b981" stroke-width="2"/>
    <text x="382" y="132" fill="#a7f3d0" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Critical</text>
    <text x="385" y="146" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="9">Section</text>

    <rect x="40" y="190" width="390" height="34" rx="4" fill="#08140f" stroke="#10b981" stroke-opacity="0.3"/>
    <text x="50" y="212" fill="#10b981" font-family="ui-monospace, monospace" font-size="11" font-weight="700">&check; THEOREM PROVED: Acyclic Lock Ordering Guarantees Zero Deadlocks</text>
  </g>

  <!-- Bottom SMT-LIB 2.0 Terminal Specification -->
  <g transform="translate(20, 390)">
    <rect width="960" height="190" rx="8" fill="#11131c" stroke="#27272a"/>
    <rect width="960" height="30" rx="8" fill="#181a24"/>
    <text x="20" y="20" fill="#a855f7" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Z3 SMT-LIB 2.0 FORMAL SPECIFICATION SCRIPT</text>
    <g transform="translate(20, 46)" font-family="ui-monospace, monospace" font-size="11" fill="#c4b5fd">
      <text y="14"><tspan fill="#60a5fa">(set-logic</tspan> QF_LIA)</text>
      <text y="32"><tspan fill="#60a5fa">(declare-const</tspan> rank_L1 Int) <tspan fill="#60a5fa">(declare-const</tspan> rank_L2 Int)</text>
      <text y="50"><tspan fill="#60a5fa">(assert</tspan> (and (&gt;= rank_L1 0) (&gt;= rank_L2 0)))</text>
      <text y="68"><tspan fill="#60a5fa">(assert</tspan> (&lt; rank_L1 rank_L2)) <tspan fill="#71717a">; Strictly ascending monotonic ID ordering constraint</tspan></text>
      <text y="86"><tspan fill="#60a5fa">(assert</tspan> (not (and (&lt; rank_L1 rank_L2) (&lt; rank_L2 rank_L1)))) <tspan fill="#71717a">; No cyclic wait condition</tspan></text>
      <text y="104" fill="#10b981" font-weight="700"><tspan fill="#60a5fa">(check-sat)</tspan> &rarr; sat (Verified Sound &amp; Satisfiable in 0.003s)</text>
      <text y="122" fill="#a7f3d0"><tspan fill="#60a5fa">(get-model)</tspan> &rarr; [rank_L1 = 0, rank_L2 = 1]</text>
    </g>
  </g>
</svg>
