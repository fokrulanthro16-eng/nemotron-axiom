[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-sh"
version = "1.0.0"
description = "Autonomous Neuro-Symbolic Verification & Provably Correct Code Synthesizer"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nemotron AXIOM Contributors" }]
keywords = ["formal-verification", "smt", "z3", "concurrency", "deadlock", "nebius", "nemotron"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "openai>=1.35.0",
    "z3-solver>=4.13.0",
    "tavily-python>=0.3.5",
    "rich>=13.7.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "gunicorn>=22.0.0",
]

[project.scripts]
axiom = "axiom_cli.main:cli_entrypoint"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "axiom_cli*"]
